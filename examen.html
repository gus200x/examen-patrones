<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examen Patrones de Diseño</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; color: #333; }
    .question { background: #fff; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .question h3 { margin: 0 0 10px; }
    .options label { display: block; margin-bottom: 8px; cursor: pointer; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 16px; }
    .result { text-align: center; font-size: 20px; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Evaluación de Patrones de Diseño</h1>
  <form id="quizForm"></form>
  <div class="result" id="result"></div>

  <script>
    const preguntas = [
      {
        pregunta: "¿Qué es un patrón de diseño en ingeniería de software?",
        opciones: ["Una herramienta para programar en ensamblador", "Un modelo terminado de código listo para compilar", "Una solución general y reutilizable a problemas comunes", "Una estructura de base de datos fija"],
        correcta: 2
      },
      {
        pregunta: "¿Qué característica define mejor un patrón de diseño?",
        opciones: ["Código específico", "Estructura exacta de clases", "Modelo adaptable para distintos problemas", "Algoritmo único"],
        correcta: 2
      },
      {
        pregunta: "¿Cuál patrón garantiza una única instancia?",
        opciones: ["Observer", "Composite", "MVC", "Singleton"],
        correcta: 3
      },
      {
        pregunta: "En MVC, ¿quién actúa como intermediario?",
        opciones: ["Vista", "Modelo", "Controlador", "Usuario"],
        correcta: 2
      },
      {
        pregunta: "¿Cuál no es un patrón arquitectónico?",
        opciones: ["Patrón de capas", "Singleton", "Cliente-servidor", "Pipe & Filter"],
        correcta: 1
      },
      {
        pregunta: "El patrón Observer se utiliza para:",
        opciones: ["Ocultar detalles de implementación", "Notificar cambios a múltiples objetos", "Compartir estados globales", "Crear jerarquías de clases"],
        correcta: 1
      },
      {
        pregunta: "¿Qué patrón define una jerarquía de objetos compuestos y simples?",
        opciones: ["Composite", "Strategy", "MVC", "Singleton"],
        correcta: 0
      },
      {
        pregunta: "¿Cuál es una ventaja del patrón MVC?",
        opciones: ["Elimina el modelo", "Evita vistas múltiples", "Permite separar responsabilidades", "Unifica vista y controlador"],
        correcta: 2
      },
      {
        pregunta: "¿Qué patrón usa suscriptores/notificadores?",
        opciones: ["Strategy", "Observer", "Factory", "Builder"],
        correcta: 1
      },
      {
        pregunta: "¿Cuál patrón permite modificar vistas sin tocar el modelo?",
        opciones: ["Composite", "MVC", "Observer", "Singleton"],
        correcta: 1
      },
      {
        pregunta: "¿Qué patrón estructural permite tratar objetos compuestos y simples por igual?",
        opciones: ["Adapter", "Bridge", "Composite", "Decorator"],
        correcta: 2
      },
      {
        pregunta: "¿Qué patrón encapsula el proceso de creación de objetos?",
        opciones: ["Factory Method", "Strategy", "Adapter", "Template Method"],
        correcta: 0
      },
      {
        pregunta: "¿Qué patrón permite múltiples vistas sobre un mismo modelo?",
        opciones: ["Singleton", "Observer", "MVC", "Builder"],
        correcta: 2
      },
      {
        pregunta: "¿Qué patrón promueve bajo acoplamiento y notificaciones automáticas?",
        opciones: ["Observer", "Factory", "Builder", "Prototype"],
        correcta: 0
      },
      {
        pregunta: "¿Qué patrón implica una clase abstracta y clases hijas con diferentes comportamientos?",
        opciones: ["Composite", "Factory", "Strategy", "Observer"],
        correcta: 2
      },
      {
        pregunta: "¿Qué patrón ayuda cuando los objetos necesitan ser notificados de un cambio en otro objeto?",
        opciones: ["Composite", "Observer", "Decorator", "Facade"],
        correcta: 1
      },
      {
        pregunta: "¿Qué patrón permite crear estructuras jerárquicas de objetos?",
        opciones: ["Prototype", "Builder", "Composite", "Adapter"],
        correcta: 2
      },
      {
        pregunta: "¿Qué patrón se usa para desacoplar lógica de datos y presentación?",
        opciones: ["MVC", "Builder", "Decorator", "Singleton"],
        correcta: 0
      },
      {
        pregunta: "En Observer, ¿qué hace el sujeto observado?",
        opciones: ["Recibe mensajes", "Notifica a los observadores", "Genera objetos", "Cambia el modelo"],
        correcta: 1
      },
      {
        pregunta: "¿Cuál es una consecuencia positiva de usar Singleton?",
        opciones: ["Se pueden crear muchas instancias", "Evita colisiones de clases", "Control centralizado de acceso", "Evita patrones de diseño"],
        correcta: 2
      },
      {
        pregunta: "¿Cuál patrón es más adecuado para una cola de impresión única?",
        opciones: ["Observer", "Composite", "Singleton", "MVC"],
        correcta: 2
      },
      {
        pregunta: "¿Cuál patrón se usa para notificar cambios sin conocer quién necesita el cambio?",
        opciones: ["Observer", "Builder", "Adapter", "MVC"],
        correcta: 0
      },
      {
        pregunta: "¿Qué patrón facilita la extensión de funcionalidades sin modificar clases existentes?",
        opciones: ["Strategy", "Decorator", "Observer", "Builder"],
        correcta: 1
      },
      {
        pregunta: "¿Cuál patrón separa objeto, vista y controlador para mayor flexibilidad?",
        opciones: ["MVC", "Strategy", "Singleton", "Composite"],
        correcta: 0
      },
      {
        pregunta: "¿Qué patrón permite que el modelo notifique cambios sin acoplarse a la vista?",
        opciones: ["Factory", "Strategy", "MVC", "Observer"],
        correcta: 3
      },
      {
        pregunta: "¿Qué patrón permite crear objetos sin especificar su clase concreta?",
        opciones: ["Adapter", "Factory Method", "Composite", "Observer"],
        correcta: 1
      },
      {
        pregunta: "¿Cuál patrón crea árboles de objetos jerárquicos?",
        opciones: ["Strategy", "Composite", "Factory", "Singleton"],
        correcta: 1
      },
      {
        pregunta: "¿Cuál patrón permite manejar múltiples componentes con la misma interfaz?",
        opciones: ["Composite", "Bridge", "Prototype", "Strategy"],
        correcta: 0
      },
      {
        pregunta: "¿Qué patrón establece relaciones uno a muchos entre objetos?",
        opciones: ["Composite", "Observer", "MVC", "Adapter"],
        correcta: 1
      },
      {
        pregunta: "¿Qué patrón define una interfaz pero deja algunos pasos a las subclases?",
        opciones: ["Template Method", "Builder", "Factory", "Strategy"],
        correcta: 0
      }
    ];

    function generarCuestionario() {
      const formulario = document.getElementById("quizForm");
      formulario.innerHTML = "";
      const seleccionadas = preguntas.sort(() => 0.5 - Math.random()).slice(0, 10);
      seleccionadas.forEach((p, i) => {
        const bloque = document.createElement("div");
        bloque.className = "question";
        bloque.innerHTML = `<h3>${i + 1}. ${p.pregunta}</h3>`;
        p.opciones.forEach((opcion, j) => {
          bloque.innerHTML += `
            <div class="options">
              <label>
                <input type="radio" name="pregunta${i}" value="${j}">
                ${opcion}
              </label>
            </div>`;
        });
        formulario.appendChild(bloque);
      });
      const btn = document.createElement("button");
      btn.textContent = "Calificar";
      btn.type = "button";
      btn.onclick = () => calificar(seleccionadas);
      formulario.appendChild(btn);
    }

    function calificar(seleccionadas) {
      let correctas = 0;
      seleccionadas.forEach((p, i) => {
        const seleccion = document.querySelector(`input[name="pregunta${i}"]:checked`);
        if (seleccion && parseInt(seleccion.value) === p.correcta) correctas++;
      });
      const result = document.getElementById("result");
      result.textContent = `✅ Obtuviste ${correctas} de 10. Nivel: ${nivel(correctas)}`;
    }

    function nivel(puntaje) {
      if (puntaje >= 8) return "Excelente";
      if (puntaje >= 6) return "Bueno";
      return "Necesitas repasar";
    }

    // Inicializa
    generarCuestionario();
  </script>
</body>
</html>
