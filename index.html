<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Examen Patrones de Diseño</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .question {
      background: #fff;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .question h3 {
      margin: 0 0 10px;
    }
    .options label {
      display: block;
      margin-bottom: 8px;
      cursor: pointer;
      padding: 5px;
      border-radius: 4px;
    }
    .correct {
      background-color: #d4edda;
      border: 1px solid #28a745;
      color: #155724;
    }
    .incorrect {
      background-color: #f8d7da;
      border: 1px solid #dc3545;
      color: #721c24;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
    .result {
      text-align: center;
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Evaluación de Patrones de Diseño</h1>
  <form id="quizForm"></form>
  <div class="result" id="result"></div>

  <script>
    const preguntas = [
      {
        pregunta: "¿Qué es un patrón de diseño en ingeniería de software?",
        opciones: ["Una herramienta para programar en ensamblador", "Un modelo terminado de código listo para compilar", "Una solución general y reutilizable a problemas comunes", "Una estructura de base de datos fija"],
        correcta: 2
      },
      {
        pregunta: "¿Qué característica define mejor un patrón de diseño?",
        opciones: ["Código específico", "Estructura exacta de clases", "Modelo adaptable para distintos problemas", "Algoritmo único"],
        correcta: 2
      },
      {
        pregunta: "¿Cuál patrón garantiza una única instancia?",
        opciones: ["Observer", "Composite", "MVC", "Singleton"],
        correcta: 3
      },
      {
        pregunta: "En MVC, ¿quién actúa como intermediario?",
        opciones: ["Vista", "Modelo", "Controlador", "Usuario"],
        correcta: 2
      },
      {
        pregunta: "¿Cuál no es un patrón arquitectónico?",
        opciones: ["Patrón de capas", "Singleton", "Cliente-servidor", "Pipe & Filter"],
        correcta: 1
      },
      // ... puedes seguir agregando las otras preguntas aquí ...
    ];

    function generarCuestionario() {
      const formulario = document.getElementById("quizForm");
      formulario.innerHTML = "";
      const seleccionadas = preguntas.sort(() => 0.5 - Math.random()).slice(0, 10);
      seleccionadas.forEach((p, i) => {
        const bloque = document.createElement("div");
        bloque.className = "question";
        bloque.innerHTML = `<h3>${i + 1}. ${p.pregunta}</h3>`;
        p.opciones.forEach((opcion, j) => {
          bloque.innerHTML += `
            <div class="options">
              <label id="label-${i}-${j}">
                <input type="radio" name="pregunta${i}" value="${j}">
                ${opcion}
              </label>
            </div>`;
        });
        formulario.appendChild(bloque);
      });
      const btn = document.createElement("button");
      btn.textContent = "Calificar";
      btn.type = "button";
      btn.onclick = () => calificar(seleccionadas);
      formulario.appendChild(btn);
    }

    function calificar(seleccionadas) {
      let correctas = 0;
      seleccionadas.forEach((p, i) => {
        const seleccion = document.querySelector(`input[name="pregunta${i}"]:checked`);
        const correcta = p.correcta;
        for (let j = 0; j < p.opciones.length; j++) {
          const label = document.getElementById(`label-${i}-${j}`);
          label.classList.remove("correct", "incorrect");
          if (j === correcta) {
            label.classList.add("correct");
          }
        }
        if (seleccion) {
          const valor = parseInt(seleccion.value);
          if (valor === correcta) {
            correctas++;
          } else {
            document.getElementById(`label-${i}-${valor}`).classList.add("incorrect");
          }
        }
      });
      const result = document.getElementById("result");
      result.textContent = `✅ Obtuviste ${correctas} de 10. Nivel: ${nivel(correctas)}`;
    }

    function nivel(puntaje) {
      if (puntaje >= 8) return "Excelente";
      if (puntaje >= 6) return "Bueno";
      return "Necesitas repasar";
    }

    generarCuestionario();
  </script>
</body>
</html>
